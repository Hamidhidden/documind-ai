[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.1.0"
description = "An AI-powered document intelligence platform."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<5.4",
  "drf-spectacular>=0.27,<0.28",
  "django-cors-headers>=4.4,<4.5",
  "celery[redis]>=5.4,<5.5",
  "psycopg[binary]>=3.2,<3.3",
  "pgvector>=0.3,<0.4",
  "openai>=1.40,<2",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "gunicorn>=23.0,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<0.7",
  "black>=24.8,<25",
  "mypy>=1.11,<2",
  "django-stubs>=5.0,<6",
  "djangorestframework-stubs>=3.15,<3.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "--reuse-db --cov=apps --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "docx.*", "pypdf.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.accounts.views", "apps.collections.views", "apps.conversations.views", "apps.documents.views"]
disable_error_code = ["arg-type", "assignment", "attr-defined", "misc", "override", "type-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["apps.conversations.tasks", "apps.documents.tasks"]
disable_error_code = ["attr-defined", "untyped-decorator"]

[tool.django-stubs]
django_settings_module = "config.settings"
